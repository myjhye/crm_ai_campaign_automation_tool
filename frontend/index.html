<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#122f2a">
  <title>GrowthPilot · CRM Workspace</title>
  <link rel="stylesheet" href="/static/styles/tokens.css">
  <link rel="stylesheet" href="/static/styles/layout.css">
  <link rel="stylesheet" href="/static/styles/components.css">
  <script type="module" src="/static/src/app/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">본문으로 건너뛰기</a>
  <div class="workspace ai-closed" id="workspace">
    <aside class="sidebar">
      <a class="brand" href="#/overview"><span class="brand-mark" aria-hidden="true">G↗</span><span>GrowthPilot<small>CRM WORKSPACE</small></span></a>
      <span class="nav-label">WORKSPACE</span>
      <nav id="navigation" aria-label="주요 메뉴"></nav>
      <div class="sidebar-note"><span class="status-dot"></span> 공개 체험 공간<p>합성 데이터로 탐색하고<br>나만의 캠페인을 준비하세요.</p><small>변경 내용은 다른 방문자와 공유됩니다.</small></div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumb">Workspace <span>/</span> <strong id="breadcrumb">Overview</strong></div>
      </header>
      <section class="filters" aria-label="공통 조회 조건">
        <label class="dataset-control">데이터셋<select id="dataset-select"><option value="">불러오는 중…</option></select></label>
        <form id="period-form" class="period-form">
          <label>시작일<input id="period-from" type="date" required></label>
          <span aria-hidden="true">—</span>
          <label>종료일<input id="period-to" type="date" required></label>
          <button class="button secondary" type="submit">기간 적용</button>
        </form>
        <p id="filter-message" class="small muted" role="status"></p>
      </section>
      <div class="body-grid">
        <main id="content" tabindex="-1" aria-label="업무 화면"></main>

      </div>
    </div>
  </div>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <noscript>이 화면을 이용하려면 브라우저에서 JavaScript를 활성화해주세요.</noscript>
</body>
</html>
